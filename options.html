<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thread Peek</title>
  <style>
    body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; width: 340px; padding: 14px; margin: 0; color: #0f1419; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #e7e9ea; background: #15202b; } input, select { background: #22303c; color: inherit; border-color: #38444d; } }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    select, input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cfd9de; border-radius: 6px; font: inherit; }
    .hint { color: #8b98a5; font-size: 12px; margin-top: 4px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    #claude { display: none; }
    #saved { color: #00ba7c; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🧵 Thread Peek</h1>

  <label for="engine">Summarizer</label>
  <select id="engine">
    <option value="auto">Auto — on-device if ready, else local</option>
    <option value="local">Local extractive (no AI, instant)</option>
    <option value="ondevice">Chrome on-device AI (Gemini Nano)</option>
    <option value="claude">Claude API (your key)</option>
  </select>
  <div class="hint" id="engineHint"></div>

  <div id="claude">
    <label for="apiKey">Anthropic API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
    <label for="model">Model</label>
    <input id="model" type="text" placeholder="claude-opus-5-5">
    <div class="hint">Stored only in this browser. Thread text is sent to api.anthropic.com. claude-haiku-5-5 is far cheaper for summaries.</div>
  </div>

  <div class="row">
    <input id="includeReplies" type="checkbox">
    <label for="includeReplies" style="margin:0;font-weight:400">Show top replies (and summarize replies on single posts)</label>
  </div>
  <div class="row"><span id="saved"></span></div>

  <script src="options.js"></script>
</body>
</html>
